services:
  # ═══════════════════════════════════════════════════════════════
  # BLUE environment
  # ═══════════════════════════════════════════════════════════════
  api-blue:
    image: "${RMV_API_IMAGE:-rmv-api}:${RMV_IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rmv-api-blue
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - rmv-net
    profiles: ["blue"]

  web-blue:
    image: "${RMV_WEB_IMAGE:-rmv-web}:${RMV_IMAGE_TAG:-latest}"
    build:
      context: ../../rmv-web
      dockerfile: Dockerfile
    container_name: rmv-web-blue
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - rmv-net
    profiles: ["blue"]

  # ═══════════════════════════════════════════════════════════════
  # GREEN environment
  # ═══════════════════════════════════════════════════════════════
  api-green:
    image: "${RMV_API_IMAGE:-rmv-api}:${RMV_IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rmv-api-green
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - rmv-net
    profiles: ["green"]

  web-green:
    image: "${RMV_WEB_IMAGE:-rmv-web}:${RMV_IMAGE_TAG:-latest}"
    build:
      context: ../../rmv-web
      dockerfile: Dockerfile
    container_name: rmv-web-green
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - rmv-net
    profiles: ["green"]

  # ═══════════════════════════════════════════════════════════════
  # INFRASTRUCTURE (always running)
  # ═══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.27-alpine
    container_name: rmv-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - rmv-net

  certbot:
    image: certbot/certbot
    container_name: rmv-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    networks:
      - rmv-net

networks:
  rmv-net:
    driver: bridge
